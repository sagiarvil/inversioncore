services:
  - type: web
    name: inversioncore-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn engine.api.inversion_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: DEEPSEEK_API_KEY
        sync: false
